<!doctype html>
<html lang="en" class="h-full">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}ZSPD · Polymarket{% endblock %}</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://unpkg.com/htmx.org@2.0.3"></script>
<script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
<script>
  // Tailwind config — extend the default palette + dark mode via system preference.
  tailwind.config = {
    darkMode: 'media',
    theme: {
      extend: {
        fontFamily: {
          sans: ['Inter', 'system-ui', 'sans-serif'],
          mono: ['"JetBrains Mono"', 'ui-monospace', 'monospace'],
        },
      },
    },
  };
</script>
<style>
  body { font-family: 'Inter', system-ui, sans-serif; font-feature-settings: 'cv02','cv03','cv04','cv11'; }
  .num { font-family: 'JetBrains Mono', ui-monospace, monospace; font-variant-numeric: tabular-nums; }
  /* htmx fade-in on swap */
  .htmx-swapping { opacity: 0; transition: opacity 120ms; }
  .htmx-settling { opacity: 1; transition: opacity 120ms; }
</style>
</head>
<body class="h-full bg-zinc-50 text-zinc-900 dark:bg-zinc-950 dark:text-zinc-100 antialiased">

<header class="sticky top-0 z-30 bg-white/80 dark:bg-zinc-900/80 backdrop-blur border-b border-zinc-200 dark:border-zinc-800">
  <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-14 flex items-center justify-between">
    <div class="flex items-center gap-2">
      <a href="/" class="flex items-center gap-2 font-semibold text-zinc-900 dark:text-zinc-100">
        <svg class="w-5 h-5 text-indigo-600 dark:text-indigo-400" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M3 12c2-3 5-7 9-7s7 4 9 7"/>
          <path d="M3 12c2 3 5 7 9 7s7-4 9-7"/>
          <circle cx="12" cy="12" r="2"/>
        </svg>
        <span>ZSPD</span>
        <span class="text-zinc-400 dark:text-zinc-500 font-normal hidden sm:inline">· Polymarket Weather</span>
      </a>
    </div>
    <nav class="flex items-center gap-1 text-sm">
      {% set route = request.url.path %}
      <a href="/" class="px-3 py-1.5 rounded-md transition {{ 'bg-indigo-50 text-indigo-700 dark:bg-indigo-950 dark:text-indigo-300' if route == '/' else 'text-zinc-600 hover:bg-zinc-100 dark:text-zinc-400 dark:hover:bg-zinc-800' }}">Grid</a>
      <a href="/strategy" class="px-3 py-1.5 rounded-md transition {{ 'bg-indigo-50 text-indigo-700 dark:bg-indigo-950 dark:text-indigo-300' if route == '/strategy' else 'text-zinc-600 hover:bg-zinc-100 dark:text-zinc-400 dark:hover:bg-zinc-800' }}">Strategy</a>
      <a href="/replay" class="px-3 py-1.5 rounded-md transition {{ 'bg-indigo-50 text-indigo-700 dark:bg-indigo-950 dark:text-indigo-300' if route.startswith('/replay') else 'text-zinc-600 hover:bg-zinc-100 dark:text-zinc-400 dark:hover:bg-zinc-800' }}">Replay</a>
    </nav>
    <div class="flex items-center gap-3 text-xs text-zinc-500 dark:text-zinc-400">
      <span class="num" hx-get="/api/health-badge" hx-trigger="load, every 15s" hx-swap="innerHTML"></span>
    </div>
  </div>
</header>

<main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-6">
  {% block content %}{% endblock %}
</main>

</body>
</html>
